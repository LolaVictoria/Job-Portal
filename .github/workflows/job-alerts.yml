
name: Personal Job Alerts

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: personal-job-alerts
  cancel-in-progress: false

jobs:
  send-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore job database
        uses: actions/cache@v4
        with:
          path: jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect matching jobs
        run: python -m src.main

      - name: Inspect database state
        run: |
          python -c "import sqlite3; c=sqlite3.connect('jobs.db'); print('Jobs:', c.execute('SELECT COUNT(*) FROM jobs').fetchone()[0]); print('Pending outbox:', c.execute(\"SELECT COUNT(*) FROM email_outbox WHERE status='PENDING'\").fetchone()[0]); c.close()"

      - name: Send email digest
        run: python -m src.notifications.send_pending_digest
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
