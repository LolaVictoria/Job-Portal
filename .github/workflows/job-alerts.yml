
name: Personal Job Alerts

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: personal-job-alerts
  cancel-in-progress: false

jobs:
  send-alerts:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect matching jobs
        run: python -m src.main

      - name: Inspect database state
        run: |
          python -c "from src.storage.database import get_connection; c=get_connection(); print('Jobs:', c.execute('SELECT COUNT(*) AS n FROM jobs').fetchone()['n']); print('Pending outbox:', c.execute(\"SELECT COUNT(*) AS n FROM email_outbox WHERE status='PENDING'\").fetchone()['n']); c.close()"

      - name: Send email digest
        run: python -m src.notifications.send_pending_digest
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
